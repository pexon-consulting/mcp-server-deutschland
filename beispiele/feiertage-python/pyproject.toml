[project]
name = "feiertage-mcp"
version = "0.1.0"
description = "Beispiel-MCP-Server: gesetzliche Feiertage und Arbeitstage in Deutschland"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
feiertage-mcp = "feiertage_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feiertage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
